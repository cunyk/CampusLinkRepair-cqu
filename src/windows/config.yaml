# 校园网连接修复助手（CampusLinkRepair）Windows 配置
# 上网账号（学号）
STUDENT_ID: xxxxxxxx

# 用户密码
USER_PASSWORD: xxxxxx

# 服务器 IP（可选，用于绕过 DNS 解析，启用 DoH 时建议填写）
# 可通过 nslookup login.cqu.edu.cn 查询 IP
SERVER_IP: ""

# 登录使用的客户端 IPv4（可选）
# 接入路由器时，可填写路由器 WAN 侧在校园网中的 IPv4，由本机代替路由器进行登录
LOGIN_IP: ""

# 检查网络连接的间隔时间（秒，有效范围 5-3600）
CHECK_INTERVAL: 20

# 请求超时时间（秒，有效范围 1-300）
TIMEOUT: 5

# 调试输出（可选，true/false）：true 时在每次登录结果后输出响应正文（截断 200 字符），默认 false 不输出
DEBUG_RESPONSE: false

# VPN/代理客户端退出后遗留的本机代理恢复（Windows 专用，不绑定客户端）
# auto：端口持续拒绝连接至少 30 秒且门户直连认证成功后，停用失效项；地址保留
# detect：只诊断；off：关闭。不会修改远程代理、DNS、路由或 TUN 网卡
PROXY_RECOVERY: auto
